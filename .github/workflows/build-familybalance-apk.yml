name: Build debug APK FamilyBalance

on:
  push:
    branches:
      - master
      # I branch di lavoro: finché il workflow non è su master, workflow_dispatch non è invocabile.
      - "claude/**"
    paths:
      - "FamilyBalance/**"
      - ".github/workflows/build-familybalance-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FamilyBalance
    steps:
      - uses: actions/checkout@v4
        with:
          # Storia completa: versionCode/versionName e il changelog "Versioni" si calcolano da git log.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit test e build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBalance
          path: FamilyBalance/app/build/outputs/apk/debug/*.apk

      # Branch orfano con il solo ultimo APK, sovrascritto a ogni build: recuperarlo è un comando
      # fisso (git show origin/apk-familybalance:FamilyBalance.apk). Nome distinto da apk-artifacts,
      # già usato in questo repo dall'APK di Voice2Text.
      - name: Publish APK to apk-familybalance branch
        working-directory: .
        run: |
          APK_PATH=$(find FamilyBalance/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK_PATH" /tmp/FamilyBalance.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-familybalance
          git rm -rf . > /dev/null
          cp /tmp/FamilyBalance.apk FamilyBalance.apk
          git add FamilyBalance.apk
          git commit -m "APK FamilyBalance build for ${{ github.sha }} (${{ github.ref_name }})"
          git push --force origin HEAD:apk-familybalance
