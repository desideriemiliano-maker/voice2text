name: Build debug APK
on:
  push:
    branches: [master]
    paths-ignore:
      - "SpeseFamiglia/**"
      - ".github/workflows/build-spese-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Scrivi local.properties con la chiave Gemini
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
      - run: ./gradlew assembleDebug
      - name: Publish APK to apk-artifacts branch
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK_PATH" /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-artifacts
          git rm -rf . > /dev/null
          cp /tmp/app-debug.apk app-debug.apk
          git add app-debug.apk
          git commit -m "APK build for ${{ github.sha }}"
          git push --force origin HEAD:apk-artifacts
