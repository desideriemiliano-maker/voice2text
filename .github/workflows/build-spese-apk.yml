name: Build APK Spese Famiglia
on:
  push:
    branches: [master, "claude/**"]
    paths:
      - "SpeseFamiglia/**"
      - ".github/workflows/build-spese-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpeseFamiglia
    steps:
      - uses: actions/checkout@v4
        with:
          # Storia completa: versionCode e changelog "Versioni" si calcolano da git log.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeseFamiglia
          path: SpeseFamiglia/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to apk-spese-famiglia branch
        if: github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          APK_PATH=$(find SpeseFamiglia/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK_PATH" /tmp/SpeseFamiglia.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-spese-famiglia
          git rm -rf . > /dev/null
          cp /tmp/SpeseFamiglia.apk SpeseFamiglia.apk
          git add SpeseFamiglia.apk
          git commit -m "APK Spese Famiglia per ${{ github.sha }}"
          git push --force origin HEAD:apk-spese-famiglia
